<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1b4332">
<title>نور المسلم - Noor Al-Muslim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--panel:#f8f9fa;--text:#1a1a1a;--muted:#555;--green:#1b4332;--green2:#2d6a4f;--gold:#d4af37;--border:#e0e0e0;--shadow:0 2px 8px #00000012;--ui:'Cairo',Tahoma,sans-serif;--quran:'Amiri',serif}
[data-theme=dark]{--bg:#121212;--panel:#242424;--text:#eee;--muted:#aaa;--green:#40916c;--green2:#52b788;--border:#333;--shadow:0 2px 8px #0006}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}body{font-family:var(--ui);background:var(--bg);color:var(--text);direction:rtl;line-height:1.7;padding-bottom:145px;min-height:100vh}.hidden{display:none!important}button,input,select{font:inherit}
header{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;padding:13px 18px;display:flex;justify-content:space-between;align-items:center;box-shadow:var(--shadow)}header h1{font-size:1.25rem;color:#f4d03f}
main{max-width:820px;margin:auto;padding:16px;min-height:65vh}.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:space-around;background:var(--bg);border-top:1px solid var(--border);padding:5px 0 8px;box-shadow:0 -2px 8px #0001}.nav-btn{border:0;background:none;color:var(--muted);font-size:.67rem;flex:1;padding:5px 1px;display:flex;flex-direction:column;align-items:center;gap:2px}.nav-btn.active{color:var(--gold)}.nav-icon{font-size:1.2rem}
.btn{background:var(--green);color:white;border:0;border-radius:8px;padding:9px 14px;cursor:pointer}.btn.secondary{background:var(--gold);color:#222}.icon-btn{background:none;border:0;color:inherit;font-size:1.25rem;padding:4px 8px;cursor:pointer}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;margin:10px 0;box-shadow:var(--shadow)}.surah-item,.list-item{padding:12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer}.surah-item:last-child{border:0}.muted{color:var(--muted);font-size:.85rem}.field{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin:6px 0 12px}.ayah-text{font-family:var(--quran);font-size:1.45rem;line-height:2.25}.ayah-number{color:var(--gold);font-size:.9rem;margin:0 3px}.bismillah{text-align:center;color:var(--gold);font:1.5rem var(--quran);padding:12px}.error{background:#fee;color:#a22;padding:12px;border-radius:8px}.prayer-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.prayer-cell{display:flex;justify-content:space-between;padding:10px;background:var(--panel);border:1px solid var(--border);border-radius:8px}.prayer-cell strong{direction:ltr;color:var(--green)}#countdown-box{background:linear-gradient(135deg,var(--green),var(--green2));color:white;text-align:center;border-radius:12px;padding:16px;margin-bottom:12px}#next-prayer-name{color:#f4d03f;font-weight:bold;font-size:1.15rem}#next-prayer-countdown{font-size:1.7rem;direction:ltr}.audio-bar{position:fixed;bottom:63px;left:0;right:0;background:var(--bg);border-top:1px solid var(--border);padding:8px 12px;z-index:15;box-shadow:0 -2px 8px #0001}.audio-bar .row{display:flex;justify-content:space-between;align-items:center;gap:8px}.audio-bar input{width:100%;accent-color:var(--gold)}.toast{position:fixed;bottom:155px;left:50%;transform:translateX(-50%);background:var(--green);color:white;padding:10px 18px;border-radius:20px;z-index:50;max-width:90%;text-align:center}.spinner{margin:30px auto;border:4px solid var(--border);border-top-color:var(--green);border-radius:50%;width:35px;height:35px;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(min-width:600px){.nav-btn{font-size:.8rem}.nav-icon{font-size:1.4rem}}
</style>
</head>
<body>
<header><h1>☪️ نور المسلم</h1><button id="theme-toggle" class="icon-btn" aria-label="تبديل الوضع">🌙</button></header>
<main id="main-content"><div class="spinner"></div></main>
<nav class="bottom-nav">
<button class="nav-btn active" data-section="quran"><span class="nav-icon">📖</span>القرآن</button>
<button class="nav-btn" data-section="audio"><span class="nav-icon">🎧</span>الاستماع</button>
<button class="nav-btn" data-section="prayer"><span class="nav-icon">🕌</span>الصلاة</button>
<button class="nav-btn" data-section="adhkar"><span class="nav-icon">📿</span>الأذكار</button>
<button class="nav-btn" data-section="stories"><span class="nav-icon">📚</span>القصص</button>
<button class="nav-btn" data-section="memorization"><span class="nav-icon">🧠</span>الحفظ</button>
<button class="nav-btn" data-section="settings"><span class="nav-icon">⚙️</span>الإعدادات</button>
</nav>
<div id="audio-player" class="audio-bar hidden">
<div class="row"><span id="audio-surah-name">—</span><span id="audio-reciter-name">ياسر الدوسري</span><span id="audio-status">متوقف</span></div>
<div class="row" style="justify-content:center"><button class="icon-btn" id="prev-surah">⏮️</button><button class="icon-btn" id="play-pause">▶️</button><button class="icon-btn" id="next-surah">⏭️</button></div>
<input type="range" id="audio-progress" min="0" max="100" value="0">
<audio id="quran-audio" preload="none"></audio>
</div>
<div id="toast" class="toast hidden" role="status"></div>
<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const store={get(k,d){try{let v=localStorage.getItem('noor_'+k);return v===null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem('noor_'+k,JSON.stringify(v))}catch{} }};
function toast(s){const t=$('#toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(t.timer);t.timer=setTimeout(()=>t.classList.add('hidden'),2400)}
const App={section:'quran',font:store.get('font',1.4),theme:store.get('theme','light'),city:store.get('city','Khouribga'),method:store.get('method',21),reciter:store.get('reciter','yasser'),surahs:[],currentSurah:1,prayers:null};
const API='https://api.alquran.cloud/v1';
const CITIES={'الخريبكة':{lat:32.88,lng:-6.91},'الدار البيضاء':{lat:33.5731,lng:-7.5898},'الرباط':{lat:34.0209,lng:-6.8416},'مراكش':{lat:31.6295,lng:-7.9811},'فاس':{lat:34.0331,lng:-5.0003},'طنجة':{lat:35.7595,lng:-5.834},'أكادير':{lat:30.4278,lng:-9.5981}};
function setTheme(){document.documentElement.dataset.theme=App.theme;$('#theme-toggle').textContent=App.theme==='dark'?'☀️':'🌙'}
$('#theme-toggle').onclick=()=>{App.theme=App.theme==='dark'?'light':'dark';store.set('theme',App.theme);setTheme()};
async function requestJSON(url){const r=await fetch(url);if(!r.ok)throw Error('تعذر الاتصال بالخادم ('+r.status+')');const j=await r.json();return j.data??j}
async function getSurahs(){if(!App.surahs.length)App.surahs=await requestJSON(API+'/surah');return App.surahs}
function go(section){App.section=section;$$('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.section===section));$('#audio-player').classList.toggle('hidden',section!=='audio');const main=$('#main-content');main.innerHTML='<div class="spinner"></div>';const f={quran:showQuran,audio:showAudio,prayer:showPrayer,adhkar:showAdhkar,stories:showStories,memorization:showMemorization,settings:showSettings}[section];Promise.resolve(f()).catch(e=>main.innerHTML='<p class="error">وقع مشكل: '+escapeHTML(e.message)+'<br>تأكد من الإنترنت وحاول مجدداً.</p>')}
$$('.nav-btn').forEach(b=>b.onclick=()=>go(b.dataset.section));
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function showQuran(){const main=$('#main-content'),ss=await getSurahs();main.innerHTML=`<h2>القرآن الكريم</h2><input class="field" id="surah-search" placeholder="ابحث باسم السورة أو رقمها"><div id="surah-list"></div>`;const draw=term=>$('#surah-list').innerHTML=ss.filter(s=>s.name.includes(term)||String(s.number).includes(term)).map(s=>`<div class="surah-item" data-n="${s.number}"><span>🟢 ${s.number}. ${s.name}</span><span class="muted">${s.numberOfAyahs} آية</span></div>`).join('');draw('');$('#surah-search').oninput=e=>draw(e.target.value.trim());$('#surah-list').onclick=e=>{const item=e.target.closest('[data-n]');if(item)openSurah(+item.dataset.n)}}
async function openSurah(n){App.currentSurah=n;const main=$('#main-content');main.innerHTML='<div class="spinner"></div>';const s=await requestJSON(`${API}/surah/${n}/quran-uthmani`);let h=`<button class="btn" id="back-surahs">← قائمة السور</button><button class="btn secondary" id="font-down">A−</button><button class="btn secondary" id="font-up">A+</button><h2 style="text-align:center">${escapeHTML(s.name)}</h2>`;if(n!==9)h+='<div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>';h+='<div class="card" id="ayah-container">';s.ayahs.forEach(a=>h+=`<span class="ayah-text" style="font-size:${App.font}rem">${escapeHTML(a.text)}</span> <span class="ayah-number">﴿${a.numberInSurah}﴾</span> `);main.innerHTML=h+'</div>';$('#back-surahs').onclick=showQuran;$('#font-down').onclick=()=>changeFont(-.1);$('#font-up').onclick=()=>changeFont(.1)}
function changeFont(d){App.font=Math.max(1,Math.min(2.5,+(App.font+d).toFixed(1)));store.set('font',App.font);openSurah(App.currentSurah)}
const RECITERS={yasser:{name:'ياسر الدوسري',base:'https://server11.mp3quran.net/yasser/'},lahidan:{name:'محمد اللحيدان',base:'https://server8.mp3quran.net/lhdan/'}};
function audioURL(n){return RECITERS[App.reciter].base+String(n).padStart(3,'0')+'.mp3'}
function showAudio(){const main=$('#main-content');main.innerHTML=`<h2>الاستماع للقرآن</h2><div class="card"><label>القارئ</label><select class="field" id="reciter-select"><option value="yasser">ياسر الدوسري</option><option value="lahidan">محمد اللحيدان</option></select><p class="muted">اختار السورة واضغط للاستماع. يلزم الاتصال بالإنترنت.</p></div><div id="audio-surah-list"></div>`;$('#reciter-select').value=App.reciter;$('#reciter-select').onchange=e=>{App.reciter=e.target.value;store.set('reciter',App.reciter);$('#audio-reciter-name').textContent=RECITERS[App.reciter].name};getSurahs().then(ss=>$('#audio-surah-list').innerHTML=ss.map(s=>`<div class="surah-item" data-n="${s.number}">${s.number}. ${escapeHTML(s.name)} <span>▶️</span></div>`).join(''));$('#audio-surah-list').onclick=e=>{const i=e.target.closest('[data-n]');if(i)playSurah(+i.dataset.n)}}
function playSurah(n){const s=App.surahs.find(x=>x.number===n);if(!s){getSurahs().then(()=>playSurah(n));return}const a=$('#quran-audio');App.currentSurah=n;$('#audio-surah-name').textContent=s.name;$('#audio-reciter-name').textContent=RECITERS[App.reciter].name;$('#audio-player').classList.remove('hidden');a.src=audioURL(n);a.play().then(()=>{$('#play-pause').textContent='⏸️';$('#audio-status').textContent='يعمل'}).catch(()=>toast('تعذر التشغيل؛ جرّب مرة أخرى أو تحقق من الإنترنت'))}
$('#play-pause').onclick=()=>{const a=$('#quran-audio');if(!a.src)return playSurah(App.currentSurah);if(a.paused){a.play();$('#play-pause').textContent='⏸️';$('#audio-status').textContent='يعمل'}else{a.pause();$('#play-pause').textContent='▶️';$('#audio-status').textContent='متوقف'}};
$('#prev-surah').onclick=()=>playSurah(Math.max(1,App.currentSurah-1));$('#next-surah').onclick=()=>playSurah(Math.min(114,App.currentSurah+1));
$('#quran-audio').ontimeupdate=()=>{const a=$('#quran-audio');if(a.duration)$('#audio-progress').value=a.currentTime/a.duration*100};$('#audio-progress').oninput=e=>{const a=$('#quran-audio');if(a.duration)a.currentTime=a.duration*e.target.value/100};$('#quran-audio').onended=()=>{if(App.currentSurah<114)playSurah(App.currentSurah+1)};
async function showPrayer(){const main=$('#main-content');main.innerHTML=`<h2>مواقيت الصلاة</h2><div class="card"><label>المدينة</label><select id="city-select" class="field">${Object.keys(CITIES).map(c=>`<option>${c}</option>`).join('')}</select><button id="load-prayers" class="btn">تحديث المواقيت</button> <button id="locate" class="btn secondary">استخدم موقعي</button></div><div id="prayer-results"><div class="spinner"></div></div><div class="card"><button id="notify-prayers" class="btn">تفعيل تذكيرات الصلاة</button><p class="muted">تذكيرات محلية على الجهاز؛ يلزم تثبيت إضافة Capacitor للبناء كتطبيق.</p></div>`;$('#city-select').value=App.city;$('#load-prayers').onclick=()=>loadPrayers(CITIES[$('#city-select').value],$('#city-select').value);$('#locate').onclick=()=>{if(!navigator.geolocation){toast('تحديد الموقع غير متوفر');return}navigator.geolocation.getCurrentPosition(p=>loadPrayers({lat:p.coords.latitude,lng:p.coords.longitude},'موقعي'),()=>toast('تعذر تحديد الموقع؛ اسمح بالوصول للموقع'))};$('#notify-prayers').onclick=()=>schedulePrayerNotifications();await loadPrayers(CITIES[App.city]||CITIES['الخريبكة'],App.city)}
async function loadPrayers(coords,city){try{App.city=city;store.set('city',city);const date=new Date();const url=`https://api.aladhan.com/v1/timings/${Math.floor(date.getTime()/1000)}?latitude=${coords.lat}&longitude=${coords.lng}&method=${App.method}`;const data=await requestJSON(url);App.prayers=data.timings;const names=[['Fajr','الفجر'],['Sunrise','الشروق'],['Dhuhr','الظهر'],['Asr','العصر'],['Maghrib','المغرب'],['Isha','العشاء']];$('#prayer-results').innerHTML=`<div class="card"><h3>${escapeHTML(city)} — ${data.date?.readable||''}</h3><div class="prayer-grid">${names.map(([k,n])=>`<div class="prayer-cell"><span>${n}</span><strong>${App.prayers[k]||'—'}</strong></div>`).join('')}</div></div>`}catch(e){$('#prayer-results').innerHTML='<p class="error">تعذر جلب المواقيت. تحقق من الإنترنت.</p>'}}
async function schedulePrayerNotifications(){try{const plugin=window.Capacitor?.Plugins?.LocalNotifications;if(!plugin){toast('الإشعارات تحتاج إضافة Capacitor في نسخة Android');return}const perm=await plugin.requestPermissions();if(perm.display!=='granted'){toast('سمح للتطبيق بالإشعارات من إعدادات الهاتف');return}if(!App.prayers){toast('حمّل مواقيت الصلاة أولاً');return}const map=[['Fajr','الفجر'],['Dhuhr','الظهر'],['Asr','العصر'],['Maghrib','المغرب'],['Isha','العشاء']];const now=new Date(),notifs=[];map.forEach(([k,n],i)=>{const t=App.prayers[k];if(!t)return;const [hh,mm]=t.split(':').map(Number);const at=new Date();at.setHours(hh,mm,0,0);if(at<=now)at.setDate(at.getDate()+1);notifs.push({id:100+i,title:'حان وقت صلاة '+n,body:'حي على الصلاة — نور المسلم',schedule:{at}})});await plugin.schedule({notifications:notifs});toast('تمت برمجة تذكيرات الصلاة لليوم القادم')}catch(e){toast('تعذر إعداد التذكيرات: '+e.message)}}
const adhkar=[
['أذكار الصباح','أصبحنا وأصبح الملك لله، والحمد لله، لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير.','1'],
['أذكار الصباح','اللهم بك أصبحنا وبك أمسينا وبك نحيا وبك نموت وإليك النشور.','1'],
['أذكار المساء','أمسينا وأمسى الملك لله، والحمد لله، لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير.','1'],
['بعد الصلاة','أستغفر الله (ثلاثاً)، اللهم أنت السلام ومنك السلام، تباركت يا ذا الجلال والإكرام.','1'],
['تسبيح','سبحان الله وبحمده.','100'],
['تسبيح','أستغفر الله وأتوب إليه.','100'],
['دعاء','ربنا آتنا في الدنيا حسنة وفي الآخرة حسنة وقنا عذاب النار.','1']
];
function showAdhkar(){const main=$('#main-content');main.innerHTML=`<h2>الأذكار والأدعية</h2><div class="card"><select class="field" id="dhikr-filter"><option>الكل</option><option>أذكار الصباح</option><option>أذكار المساء</option><option>بعد الصلاة</option><option>تسبيح</option><option>دعاء</option></select></div><div id="dhikr-list"></div>`;const draw=()=>{$('#dhikr-list').innerHTML=adhkar.filter(a=>$('#dhikr-filter').value==='الكل'||a[0]===$('#dhikr-filter').value).map((a,i)=>`<div class="card"><div class="muted">${a[0]}</div><p style="font-size:1.15rem;margin:8px 0">${a[1]}</p><button class="btn" data-d="${i}">تسبيح / تم التكرار: <span id="count-${i}">${store.get('dhikr-'+i,0)}</span> / ${a[2]}</button><button class="btn secondary" data-reset="${i}">إعادة</button></div>`).join('')};draw();$('#dhikr-filter').onchange=draw;$('#dhikr-list').onclick=e=>{const b=e.target.closest('[data-d]');const r=e.target.closest('[data-reset]');if(b){const i=+b.dataset.d,v=store.get('dhikr-'+i,0)+1;store.set('dhikr-'+i,v);const el=$('#count-'+i);if(el)el.textContent=v;if(v>=+adhkar[i][2])toast('أحسنت، أكملت العدد المقترح')}if(r){store.set('dhikr-'+r.dataset.reset,0);draw()}}}
const stories=[
['آدم عليه السلام','خلق الله آدم عليه السلام وعلّمه الأسماء، وأمر الملائكة بالسجود له سجود تكريم، وأسكنه الجنة مع زوجته، ثم تاب الله عليه بعد أن تلقى كلمات التوبة.'],
['نوح عليه السلام','دعا نوح عليه السلام قومه إلى عبادة الله زمناً طويلاً، وصبر على أذاهم، ثم أمره الله بصنع السفينة، فنجّى الله المؤمنين وأهلك المكذبين بالطوفان.'],
['إبراهيم عليه السلام','دعا إبراهيم عليه السلام قومه إلى التوحيد ورفض عبادة الأصنام، وابتلاه الله فصبر، وجعل في ذريته النبوة والكتاب.'],
['موسى عليه السلام','أرسل الله موسى عليه السلام إلى فرعون، وأيده بالآيات، ونجّى بني إسرائيل من فرعون، وأعطاه التوراة.'],
['يوسف عليه السلام','رأى يوسف عليه السلام رؤيا في صغره، ومرّ بابتلاءات كثيرة، ثم أكرمه الله ومكّنه في الأرض وجمعه بأهله.'],
['محمد ﷺ','بعث الله محمداً ﷺ رحمة للعالمين، يدعو إلى عبادة الله وحده ومكارم الأخلاق، وأنزل عليه القرآن الكريم.']
];
function showStories(){const main=$('#main-content');main.innerHTML='<h2>قصص الأنبياء</h2><p class="muted">ملخصات موجزة للتذكير، ويُرجى الرجوع للقرآن الكريم والمصادر الموثوقة للتفصيل.</p>'+stories.map(s=>`<details class="card"><summary>${s[0]}</summary><p style="margin-top:8px">${s[1]}</p></details>`).join('')+'<h3>من قصص الصحابة</h3><div class="card"><b>أبو بكر الصديق رضي الله عنه</b><p>من أوائل من آمنوا برسول الله ﷺ، وصاحبه في الهجرة، وأول الخلفاء الراشدين.</p></div><div class="card"><b>عمر بن الخطاب رضي الله عنه</b><p>ثاني الخلفاء الراشدين، عُرف بالعدل والقوة في الحق.</p></div>'}
async function showMemorization(){const main=$('#main-content');main.innerHTML='<h2>مساعد حفظ القرآن</h2><p class="muted">اختار سورة، ثم اضغط على الكلمات لإظهارها أو إخفائها.</p><select class="field" id="memorize-surah"></select><button class="btn" id="load-memorize">عرض الآيات</button><div id="memorize-content"></div>';const ss=await getSurahs();$('#memorize-surah').innerHTML=ss.map(s=>`<option value="${s.number}">${s.number}. ${escapeHTML(s.name)}</option>`).join('');$('#load-memorize').onclick=async()=>{try{const s=await requestJSON(`${API}/surah/${$('#memorize-surah').value}/quran-uthmani`);$('#memorize-content').innerHTML=s.ayahs.map(a=>`<div class="card"><span>${a.text.split(' ').map(w=>`<button class="hidden-word" style="border:0;padding:2px 5px;margin:2px;font-family:var(--quran);font-size:1.2rem" onclick="this.classList.toggle('revealed');this.style.color=this.classList.contains('revealed')?'var(--text)':'transparent'">${escapeHTML(w)}</button>`).join(' ')}</span><div class="muted">الآية ${a.numberInSurah}</div></div>`).join('')}catch(e){toast('تعذر تحميل السورة')}}}
function showSettings(){const main=$('#main-content');main.innerHTML=`<h2>الإعدادات</h2><div class="card"><label>الوضع</label><button class="btn" id="setting-theme">تبديل الوضع الليلي / النهاري</button><label style="display:block;margin-top:12px">طريقة حساب مواقيت الصلاة</label><select id="method" class="field"><option value="21">المغرب (تحقق من الإعداد المحلي)</option><option value="3">رابطة العالم الإسلامي</option><option value="2">أم القرى</option><option value="5">الهيئة المصرية العامة للمساحة</option></select><button id="save-settings" class="btn">حفظ الإعدادات</button></div><div class="card"><h3>حول التطبيق</h3><p>نور المسلم — القرآن الكريم، الاستماع، مواقيت الصلاة، الأذكار، القصص، ومساعد الحفظ.</p><p class="muted">بعض الوظائف تحتاج الإنترنت. مواقيت الصلاة تعتمد على خدمة خارجية ويُستحسن التحقق منها محلياً.</p></div>`;$('#method').value=String(App.method);$('#setting-theme').onclick=()=>{$('#theme-toggle').click()};$('#save-settings').onclick=()=>{App.method=+$('#method').value;store.set('method',App.method);toast('تم حفظ الإعدادات');if(App.section==='prayer')go('prayer')}}
setTheme();go('quran');
</script>
